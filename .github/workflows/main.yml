name: Build And Create Artifacts

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "3.0" ]

jobs:
  build:
    runs-on: windows-latest

    env:
      PLUGIN_SDK_DIR: ${{ github.workspace }}/plugin-sdk

    steps:
    # 1. Version Suffix Check for non-release commits
    - name: Check for release commit
      shell: powershell
      run: |
        if ("${{ github.event.head_commit.message }}" -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            echo "VERSION_SUFFIX=${{ github.sha }}" >> $env:GITHUB_ENV
        }

    # 2. Setup x86 MSVC environment for Ninja & CMake
    - name: Setup x86 MSVC Command Prompt
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x86

    # 3. Checkout project repository
    - name: Checkout TrilogyChaosMod
      uses: actions/checkout@v7

    # 4. Clone PluginSDK into 'plugin-sdk'
    - name: Clone PluginSDK
      shell: cmd
      run: |
        if not exist plugin-sdk (
            git clone https://github.com/DK22Pac/plugin-sdk.git plugin-sdk
            cd plugin-sdk
            git checkout 15f15b60bbf74c106e1b496ff92c98764abf4605
        )

    # 5. Cache compiled PluginSDK static libraries
    - name: Cache PluginSDK Output
      id: cache-pluginsdk
      uses: actions/cache@v6
      with:
        path: plugin-sdk/output
        key: pluginsdk-${{ runner.os }}-${{ hashFiles('plugin-sdk/**') }}

    - name: Setup MSBuild
      if: steps.cache-pluginsdk.outputs.cache-hit != 'true'
      uses: microsoft/setup-msbuild@v3

    # 6. Generate and build PluginSDK ONLY if cache missed
    - name: Generate PluginSDK Solution via Premake
      if: steps.cache-pluginsdk.outputs.cache-hit != 'true'
      shell: cmd
      run: |
        "%PLUGIN_SDK_DIR%\tools\premake\premake5.exe" vs2026 --file="%PLUGIN_SDK_DIR%\tools\premake\premake5.lua"

    - name: Build PluginSDK Static Libraries
      if: steps.cache-pluginsdk.outputs.cache-hit != 'true'
      shell: cmd
      run: |
        msbuild "%PLUGIN_SDK_DIR%\plugin_III\Plugin_III.vcxproj" /p:Configuration=Release /p:Platform=Win32 /m
        msbuild "%PLUGIN_SDK_DIR%\plugin_vc\Plugin_VC.vcxproj" /p:Configuration=Release /p:Platform=Win32 /m
        msbuild "%PLUGIN_SDK_DIR%\plugin_sa\Plugin_SA.vcxproj" /p:Configuration=Release /p:Platform=Win32 /m

    # 7. Configure and Build CMake project
    - name: Configure CMake
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVERSION_SUFFIX="${{ env.VERSION_SUFFIX }}"

    - name: Compile Plugins
      run: |
        cmake --build build --config Release

    # 8. Organize outputs into designated directories
    - name: Organize Output Folders
      shell: cmd
      run: |
        if not exist build\output_III mkdir build\output_III
        if not exist build\output_VC mkdir build\output_VC
        if not exist build\output_SA mkdir build\output_SA
        if exist build\TrilogyChaosMod.III.asi copy build\TrilogyChaosMod.III.asi build\output_III\
        if exist build\TrilogyChaosMod.VC.asi copy build\TrilogyChaosMod.VC.asi build\output_VC\
        if exist build\TrilogyChaosMod.SA.asi copy build\TrilogyChaosMod.SA.asi build\output_SA\

    # 9. Upload individual ASI artifacts
    - name: Upload III Artifact
      uses: actions/upload-artifact@v7
      with:
        name: "TrilogyChaosMod.III"
        path: build/output_III/
        if-no-files-found: ignore

    - name: Upload VC Artifact
      uses: actions/upload-artifact@v7
      with:
        name: "TrilogyChaosMod.VC"
        path: build/output_VC/
        if-no-files-found: ignore

    - name: Upload SA Artifact
      uses: actions/upload-artifact@v7
      with:
        name: "TrilogyChaosMod.SA"
        path: build/output_SA/
        if-no-files-found: ignore